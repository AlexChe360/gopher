<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>


<body class="flex flex-col items-center justify-center min-h-screen bg-black text-white text-center">
    <h1 class="text-4xl font-bold mb-2">⚠️ Ошибка 200: Всё слишком хорошо</h1>
    <p class="text-lg mb-6 text-gray-300">Гофер захватил сервер и устроил дискотеку</p>
    <img src="dancing-gopher.gif" alt="Танцующий гофер" class="max-w-xs">
    <p class="mt-6 text-sm text-gray-500">Админ в курсе. Админ танцует рядом.</p>
    <audio src="music.mp3" autoplay></audio>
    <button onclick="document.getElementById('music').play(); this.remove();"
      class="mb-6 px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-full text-lg transition">
      🔊 Врубить музыку
    </button>
</body>


</html>
